[project]
name = "carrier-clearance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "phase3: messy intake and the two cards (plan/phase-3-intake-cards.md)",
    "phase4b: cost, limits and redecide (plan/phase-4-signals-cost.md, B)",
]
