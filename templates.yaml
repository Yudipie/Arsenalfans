    missing_en: "a valid IFSC (the one given was not found)"
    missing_hi: "सही IFSC (दिया गया IFSC नहीं मिला)"
  payee_missing:
    en: "The bank details have no payee name."
    hi: "बैंक विवरण में भुगतान पाने वाले का नाम नहीं है।"
    contest_en: "Send a cancelled cheque or a bank letter showing the payee name."
    contest_hi: "भुगतान पाने वाले का नाम दिखाता रद्द चेक या बैंक का पत्र भेजें।"
