  # --- c6 age and address ---
  age_address_ok:
    en: "The GST registration date ({gst_registered_on}) and address raise no concern."
    hi: "GST पंजीकरण की तारीख ({gst_registered_on}) और पते में कोई चिंता की बात नहीं है।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
