# Card sentences, one entry per rule_id. Placeholders only, no logic.
# Placeholders: any fact_id with "." replaced by "_" (e.g. {gst_status}, {gst_cancelled_on}), plus
# {gap}, {gstin}, {name}. A missing value renders as "—".
#   en / hi              the reason, on both cards
#   contest_en / _hi     vendor card: how to contest, naming the document to send
#   ask_en / _hi         follow-up draft to the vendor (Cannot verify only); shown with a copy button, never sent
#   missing_en / _hi     vendor card "Missing:" item (Cannot verify only); no entry means nothing is listed
#   internal: true       not shown on the vendor card or in follow-up drafts (approver card only)
# The Hindi was drafted, not checked by a Hindi reader. The page shows "unreviewed translation" until this is true.
hindi_reviewed: false

rules:
  # --- c1 formats (code only) ---
  formats_ok:
    en: "The GSTIN {gstin} has a valid format and check digit."
    hi: "GSTIN {gstin} का फ़ॉर्मेट और चेक डिजिट सही है।"
  gstin_missing:
    en: "No GSTIN was given, so the carrier could not be looked up."
    hi: "GSTIN नहीं दिया गया, इसलिए कैरियर की जाँच नहीं हो सकी।"
    contest_en: "Send your GST registration certificate (Form GST REG-06)."
    contest_hi: "अपना GST पंजीकरण प्रमाणपत्र (फ़ॉर्म GST REG-06) भेजें।"
    ask_en: "Hello, to complete your onboarding as a carrier, please share your 15-character GSTIN and a copy of your GST registration certificate (REG-06)."
    ask_hi: "नमस्ते, कैरियर के रूप में आपकी ऑनबोर्डिंग पूरी करने के लिए कृपया अपना 15 अक्षरों का GSTIN और GST पंजीकरण प्रमाणपत्र (REG-06) की कॉपी भेजें।"
    missing_en: "your 15-character GSTIN"
    missing_hi: "आपका 15 अक्षरों का GSTIN"
  name_and_gstin_missing:
    en: "Neither the carrier's name nor a GSTIN was given."
    hi: "न कैरियर का नाम दिया गया, न GSTIN।"
    contest_en: "Send your registered business name and your GST registration certificate (REG-06)."
    contest_hi: "अपने व्यवसाय का पंजीकृत नाम और GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
    ask_en: "Hello, we could not find your business name or GSTIN in your message. Please share your registered business name, your GSTIN and a copy of your GST registration certificate (REG-06)."
    ask_hi: "नमस्ते, आपके संदेश में व्यवसाय का नाम या GSTIN नहीं मिला। कृपया अपने व्यवसाय का पंजीकृत नाम, GSTIN और GST पंजीकरण प्रमाणपत्र (REG-06) की कॉपी भेजें।"
    missing_en: "your registered business name and GSTIN"
    missing_hi: "आपके व्यवसाय का पंजीकृत नाम और GSTIN"
  gstin_format:
    en: "The GSTIN {gstin} is not valid as written (wrong length, characters or check digit). It was not corrected."
    hi: "लिखा गया GSTIN {gstin} मान्य नहीं है (लंबाई, अक्षर या चेक डिजिट गलत है)। इसे सुधारा नहीं गया।"
    contest_en: "Send a photo of your GST registration certificate (REG-06) showing the GSTIN."
    contest_hi: "GSTIN दिखाते हुए अपने GST पंजीकरण प्रमाणपत्र (REG-06) की फ़ोटो भेजें।"
    ask_en: "Hello, the GSTIN in your message ({gstin}) does not pass the GST format check; a letter may have been typed in place of a digit. Please send the correct GSTIN, or a photo of your GST registration certificate (REG-06)."
    ask_hi: "नमस्ते, आपके संदेश का GSTIN ({gstin}) फ़ॉर्मेट जाँच में सही नहीं निकला; शायद किसी अंक की जगह अक्षर लिख दिया गया है। कृपया सही GSTIN या GST पंजीकरण प्रमाणपत्र (REG-06) की फ़ोटो भेजें।"
    missing_en: "a valid GSTIN ({gstin} does not pass the format check)"
    missing_hi: "सही GSTIN ({gstin} फ़ॉर्मेट जाँच में सही नहीं निकला)"
  gstin_state_code:
    en: "The GSTIN {gstin} starts with a state code that does not exist."
    hi: "GSTIN {gstin} की शुरुआत ऐसे राज्य कोड से होती है जो मौजूद नहीं है।"
    contest_en: "Send your GST registration certificate (REG-06)."
    contest_hi: "अपना GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
    ask_en: "Hello, the GSTIN you shared ({gstin}) has a state code that does not exist. Please check it and send the correct GSTIN with your GST registration certificate (REG-06)."
    ask_hi: "नमस्ते, आपके दिए GSTIN ({gstin}) का राज्य कोड मौजूद नहीं है। कृपया जाँच कर सही GSTIN और GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
    missing_en: "a valid GSTIN ({gstin} has a state code that does not exist)"
    missing_hi: "सही GSTIN ({gstin} का राज्य कोड मौजूद नहीं है)"
  pan_mismatch:
    en: "The PAN given differs from the PAN inside the GSTIN {gstin}."
    hi: "दिया गया PAN, GSTIN {gstin} के अंदर के PAN से मेल नहीं खाता।"
    contest_en: "Send a copy of your PAN card and your GST registration certificate (REG-06)."
    contest_hi: "अपने PAN कार्ड और GST पंजीकरण प्रमाणपत्र (REG-06) की कॉपी भेजें।"
    ask_en: "Hello, the PAN you shared does not match the PAN inside your GSTIN. Please confirm which is correct and send a copy of your PAN card."
    ask_hi: "नमस्ते, आपका दिया PAN आपके GSTIN के अंदर के PAN से मेल नहीं खाता। कृपया बताएँ कि कौन सा सही है और PAN कार्ड की कॉपी भेजें।"
    missing_en: "which PAN is correct (the PAN given differs from the one inside the GSTIN)"
    missing_hi: "कौन सा PAN सही है (दिया गया PAN, GSTIN के अंदर के PAN से अलग है)"
  ifsc_format:
    en: "The IFSC given is not in a valid format."
    hi: "दिया गया IFSC सही फ़ॉर्मेट में नहीं है।"
    contest_en: "Send a cancelled cheque or a bank letter showing the IFSC."
    contest_hi: "IFSC दिखाता हुआ रद्द चेक या बैंक का पत्र भेजें।"
    ask_en: "Hello, the IFSC in your message is not in a valid format. Please send a cancelled cheque or a bank letter showing your account's IFSC."
    ask_hi: "नमस्ते, आपके संदेश का IFSC सही फ़ॉर्मेट में नहीं है। कृपया अपने खाते का IFSC दिखाता हुआ रद्द चेक या बैंक का पत्र भेजें।"
    missing_en: "a valid IFSC"
    missing_hi: "सही IFSC"
  parse_failed:
    en: "The pasted request could not be read into the onboarding form."
    hi: "भेजे गए संदेश को ऑनबोर्डिंग फ़ॉर्म में पढ़ा नहीं जा सका।"
    contest_en: "Fill in the onboarding form, or send your GSTIN, business name and bank details as plain text."
    contest_hi: "ऑनबोर्डिंग फ़ॉर्म भरें, या अपना GSTIN, व्यवसाय का नाम और बैंक विवरण सादे टेक्स्ट में भेजें।"
    ask_en: "Hello, we could not read your onboarding details from your message. Please send your business name, GSTIN, IFSC and payee name, one per line."
    ask_hi: "नमस्ते, आपके संदेश से ऑनबोर्डिंग विवरण पढ़े नहीं जा सके। कृपया व्यवसाय का नाम, GSTIN, IFSC और भुगतान पाने वाले का नाम, हर एक अलग लाइन में भेजें।"
    missing_en: "your business name, GSTIN, IFSC and payee name"
    missing_hi: "आपके व्यवसाय का नाम, GSTIN, IFSC और भुगतान पाने वाले का नाम"

  # --- c2 GST status ---
  gst_active:
    en: "GST lists the GSTIN as {gst_status}."
    hi: "GST के रिकॉर्ड में GSTIN की स्थिति {gst_status} है।"
  gst_cancelled:
    en: "GST lists the GSTIN as {gst_status}, cancelled on {gst_cancelled_on}."
    hi: "GST के रिकॉर्ड में GSTIN की स्थिति {gst_status} है, {gst_cancelled_on} को रद्द।"
    contest_en: "Send the GST revocation order (Form GST REG-22) restoring the registration."
    contest_hi: "पंजीकरण बहाल करने वाला GST रद्दीकरण-वापसी आदेश (फ़ॉर्म GST REG-22) भेजें।"
  gst_suspended:
    en: "GST lists the GSTIN as {gst_status}."
    hi: "GST के रिकॉर्ड में GSTIN की स्थिति {gst_status} है।"
    contest_en: "Send the GST order lifting the suspension, or proof that the registration is active again."
    contest_hi: "निलंबन हटाने का GST आदेश, या पंजीकरण फिर से सक्रिय होने का प्रमाण भेजें।"
  gst_status_other:
    en: "GST lists the GSTIN with an unusual status: {gst_status}."
    hi: "GST के रिकॉर्ड में GSTIN की स्थिति असामान्य है: {gst_status}।"
    contest_en: "Send a current screenshot of your GSTIN on gst.gov.in and your registration certificate (REG-06)."
    contest_hi: "gst.gov.in पर अपने GSTIN का ताज़ा स्क्रीनशॉट और पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
  gst_not_found:
    en: "GST has no record of the GSTIN {gstin}."
    hi: "GST के पास GSTIN {gstin} का कोई रिकॉर्ड नहीं है।"
    contest_en: "Send your GST registration certificate (REG-06)."
    contest_hi: "अपना GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
    ask_en: "Hello, the GST system has no record of the GSTIN you shared ({gstin}). Please recheck it and send your GST registration certificate (REG-06)."
    ask_hi: "नमस्ते, GST सिस्टम में आपके दिए GSTIN ({gstin}) का कोई रिकॉर्ड नहीं है। कृपया इसे दोबारा जाँचें और GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
    missing_en: "a GSTIN that GST has a record of ({gstin} was not found)"
    missing_hi: "ऐसा GSTIN जिसका GST में रिकॉर्ड हो ({gstin} नहीं मिला)"

  # --- c3 identity ---
  identity_confirmed:
    en: "GST confirms the GSTIN {gstin} belongs to {name}."
    hi: "GST पुष्टि करता है कि GSTIN {gstin} {name} का है।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  identity_pan_level:
    en: "GST confirms the company {gst_legal_name} for the GSTIN {gstin}, found from the name given."
    hi: "दिए गए नाम से मिले GSTIN {gstin} के लिए GST कंपनी {gst_legal_name} की पुष्टि करता है।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  identity_unconfirmed:
    en: "GST did not confirm who holds the GSTIN {gstin}."
    hi: "GST ने पुष्टि नहीं की कि GSTIN {gstin} किसका है।"
    contest_en: "Send your GST registration certificate (REG-06)."
    contest_hi: "अपना GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
    ask_en: "Hello, we could not confirm your GST registration ({gstin}). Please send a copy of your GST registration certificate (REG-06)."
    ask_hi: "नमस्ते, हम आपके GST पंजीकरण ({gstin}) की पुष्टि नहीं कर सके। कृपया अपने GST पंजीकरण प्रमाणपत्र (REG-06) की कॉपी भेजें।"
    missing_en: "a copy of your GST registration certificate (REG-06)"
    missing_hi: "आपके GST पंजीकरण प्रमाणपत्र (REG-06) की कॉपी"
  name_mismatch:
    en: "The name given, {name}, does not match the GST legal name ({gst_legal_name}) or trade name ({gst_trade_name})."
    hi: "दिया गया नाम {name} GST के कानूनी नाम ({gst_legal_name}) या व्यापार नाम ({gst_trade_name}) से मेल नहीं खाता।"
    contest_en: "Send your GST registration certificate (REG-06) showing your legal and trade names."
    contest_hi: "अपना कानूनी और व्यापार नाम दिखाता GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
  several_pans:
    en: "More than one company with this name holds a GSTIN; we could not tell which one is {name}."
    hi: "इस नाम की एक से ज़्यादा कंपनियों के पास GSTIN है; हम तय नहीं कर सके कि {name} कौन सी है।"
    contest_en: "Send your GSTIN and GST registration certificate (REG-06)."
    contest_hi: "अपना GSTIN और GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
  identify_tie:
    en: "Several companies match the name {name} equally well; we could not tell which one is yours."
    hi: "नाम {name} से कई कंपनियाँ बराबर मेल खाती हैं; हम तय नहीं कर सके कि आपकी कौन सी है।"
    contest_en: "Send your GSTIN and GST registration certificate (REG-06)."
    contest_hi: "अपना GSTIN और GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
  acquired_or_merged:
    en: "Records show the company may have been acquired or merged."
    hi: "रिकॉर्ड बताते हैं कि कंपनी का अधिग्रहण या विलय हुआ हो सकता है।"
    contest_en: "Send a document showing the company's current ownership, such as the latest MCA filing."
    contest_hi: "कंपनी का मौजूदा स्वामित्व दिखाने वाला दस्तावेज़ भेजें, जैसे ताज़ा MCA फ़ाइलिंग।"
  discovery_none:
    en: "No GST-registered company was found for the name {name}."
    hi: "नाम {name} के लिए कोई GST-पंजीकृत कंपनी नहीं मिली।"
    contest_en: "Send your 15-character GSTIN and your GST registration certificate (REG-06)."
    contest_hi: "अपना 15 अक्षरों का GSTIN और GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
    ask_en: "Hello, we could not find a GST registration for {name}. Please share your 15-character GSTIN and a copy of your GST registration certificate (REG-06)."
    ask_hi: "नमस्ते, हमें {name} का GST पंजीकरण नहीं मिला। कृपया अपना 15 अक्षरों का GSTIN और GST पंजीकरण प्रमाणपत्र (REG-06) की कॉपी भेजें।"
    missing_en: "your 15-character GSTIN"
    missing_hi: "आपका 15 अक्षरों का GSTIN"

  # --- c4 duplicates ---
  dup_none:
    en: "No other vendor or earlier request uses this GSTIN or PAN."
    hi: "कोई दूसरा वेंडर या पिछला अनुरोध इस GSTIN या PAN का उपयोग नहीं करता।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  dup_known_vendor:
    en: "This GSTIN is already on our vendor list under the same name."
    hi: "यह GSTIN उसी नाम से हमारी वेंडर सूची में पहले से है।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  dup_branch:
    en: "The same PAN is on our vendor list under another GSTIN: this is treated as a branch."
    hi: "यही PAN किसी दूसरे GSTIN के साथ हमारी वेंडर सूची में है: इसे शाखा माना गया है।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  dup_other_name:
    en: "This GSTIN or PAN is already on our records under a different business name."
    hi: "यह GSTIN या PAN हमारे रिकॉर्ड में किसी दूसरे व्यवसाय-नाम से पहले से है।"
    contest_en: "Send your GST registration certificate (REG-06) and a note explaining the other name."
    contest_hi: "अपना GST पंजीकरण प्रमाणपत्र (REG-06) और दूसरे नाम के बारे में एक नोट भेजें।"
  bank_changed:
    en: "This GSTIN is on our records with a different bank account."
    hi: "यह GSTIN हमारे रिकॉर्ड में किसी दूसरे बैंक खाते के साथ है।"
    contest_en: "Send a cancelled cheque for the new account and a signed letter confirming the change."
    contest_hi: "नए खाते का रद्द चेक और बदलाव की पुष्टि करता हस्ताक्षरित पत्र भेजें।"

  # --- c9 bank ---
  bank_ok:
    en: "The IFSC is a {ifsc_bank} branch ({ifsc_branch}) and the payee name matches the GST name."
    hi: "IFSC {ifsc_bank} की शाखा ({ifsc_branch}) है और प्राप्तकर्ता का नाम GST नाम से मेल खाता है।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  bank_not_given:
    en: "No bank details were given; they must be checked before the first payment."
    hi: "बैंक विवरण नहीं दिए गए; पहले भुगतान से पहले इनकी जाँच ज़रूरी है।"
    contest_en: "Send a cancelled cheque or bank letter showing the account, IFSC and payee name."
    contest_hi: "खाता, IFSC और प्राप्तकर्ता का नाम दिखाता रद्द चेक या बैंक पत्र भेजें।"
  ifsc_missing:
    en: "Bank details were given without an IFSC."
    hi: "बैंक विवरण बिना IFSC के दिए गए।"
    contest_en: "Send a cancelled cheque showing the IFSC."
    contest_hi: "IFSC दिखाता रद्द चेक भेजें।"
    ask_en: "Hello, please share the IFSC of your bank branch, or a cancelled cheque showing it."
    ask_hi: "नमस्ते, कृपया अपनी बैंक शाखा का IFSC, या उसे दिखाता रद्द चेक भेजें।"
    missing_en: "your bank branch's IFSC"
    missing_hi: "आपकी बैंक शाखा का IFSC"
  ifsc_not_found:
    en: "The IFSC given was not found in the bank directory."
    hi: "दिया गया IFSC बैंक निर्देशिका में नहीं मिला।"
    contest_en: "Send a cancelled cheque showing the IFSC."
    contest_hi: "IFSC दिखाता रद्द चेक भेजें।"
    ask_en: "Hello, the IFSC you shared was not found. Please recheck it and send a cancelled cheque showing it."
    ask_hi: "नमस्ते, आपका दिया IFSC नहीं मिला। कृपया इसे दोबारा जाँचें और उसे दिखाता रद्द चेक भेजें।"
    missing_en: "a valid IFSC"
    missing_hi: "सही IFSC"
  payee_missing:
    en: "The payee name on the bank account was not given."
    hi: "बैंक खाते पर प्राप्तकर्ता का नाम नहीं दिया गया।"
    contest_en: "Send a cancelled cheque showing the payee name."
    contest_hi: "प्राप्तकर्ता का नाम दिखाता रद्द चेक भेजें।"
    ask_en: "Hello, please share the account holder's name as it appears on your bank account, or a cancelled cheque showing it."
    ask_hi: "नमस्ते, कृपया बैंक खाते पर लिखा खाताधारक का नाम, या उसे दिखाता रद्द चेक भेजें।"
    missing_en: "the payee name on your bank account"
    missing_hi: "आपके बैंक खाते पर प्राप्तकर्ता का नाम"
  payee_mismatch:
    en: "The payee name does not match the GST legal name ({gst_legal_name}) or trade name ({gst_trade_name})."
    hi: "प्राप्तकर्ता का नाम GST के कानूनी नाम ({gst_legal_name}) या व्यापार नाम ({gst_trade_name}) से मेल नहीं खाता।"
    contest_en: "Send a cancelled cheque from an account in the business's GST name."
    contest_hi: "व्यवसाय के GST नाम वाले खाते का रद्द चेक भेजें।"

  # --- c5 activity (optional: Refer or a gap, never a block) ---
  active:
    en: "The company shows recent activity (news, open roles or a live website)."
    hi: "कंपनी में हाल की गतिविधि दिखती है (ख़बरें, खुली नौकरियाँ या चालू वेबसाइट)।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  dormant:
    en: "The company looks dormant: status {crustdata_status}, or its website {site_url} is down."
    hi: "कंपनी निष्क्रिय लगती है: स्थिति {crustdata_status}, या इसकी वेबसाइट {site_url} बंद है।"
    contest_en: "Send recent invoices or e-way bills showing the business is operating."
    contest_hi: "व्यवसाय चालू होने का प्रमाण देते हाल के इनवॉइस या ई-वे बिल भेजें।"
  no_recent_activity:
    internal: true                 # optional signal; approver card only
    en: "No recent activity found: {gap}."
    hi: "हाल की कोई गतिविधि नहीं मिली: {gap}।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
    ask_en: "Hello, please share a recent invoice or e-way bill so we can confirm your business is operating."
    ask_hi: "नमस्ते, कृपया हाल का कोई इनवॉइस या ई-वे बिल भेजें ताकि हम पुष्टि कर सकें कि आपका व्यवसाय चालू है।"
  no_activity_data:
    internal: true                 # optional signal; approver card only
    en: "Activity was not checked: {gap}."
    hi: "गतिविधि की जाँच नहीं हुई: {gap}।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
    ask_en: "Hello, please share a recent invoice or e-way bill so we can confirm your business is operating."
    ask_hi: "नमस्ते, कृपया हाल का कोई इनवॉइस या ई-वे बिल भेजें ताकि हम पुष्टि कर सकें कि आपका व्यवसाय चालू है।"

  # --- c6 age and address (optional) ---
  age_address_ok:
    en: "GST registered the business on {gst_registered_on} in {gst_state}."
    hi: "GST ने व्यवसाय को {gst_registered_on} को {gst_state} में पंजीकृत किया।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  gst_too_new:
    en: "The GST registration is recent: {gst_registered_on}."
    hi: "GST पंजीकरण हाल का है: {gst_registered_on}।"
    contest_en: "Send proof of earlier trading, such as older invoices or a previous registration."
    contest_hi: "पहले के कारोबार का प्रमाण भेजें, जैसे पुराने इनवॉइस या पिछला पंजीकरण।"
  state_mismatch:
    en: "GST lists the business in {gst_state}, not the state given."
    hi: "GST व्यवसाय को {gst_state} में दिखाता है, दिए गए राज्य में नहीं।"
    contest_en: "Send your GST registration certificate (REG-06) for the state you operate from."
    contest_hi: "जिस राज्य से आप काम करते हैं उसका GST पंजीकरण प्रमाणपत्र (REG-06) भेजें।"
  domain_too_new:
    en: "The company's website domain was registered recently: {rdap_registered_on}."
    hi: "कंपनी की वेबसाइट का डोमेन हाल ही में पंजीकृत हुआ: {rdap_registered_on}।"
    contest_en: "Send proof of earlier trading, such as older invoices."
    contest_hi: "पहले के कारोबार का प्रमाण भेजें, जैसे पुराने इनवॉइस।"
  gst_date_missing:
    internal: true                 # a gap in the source record; approver card only
    en: "The GST registration date is not in the record."
    hi: "GST पंजीकरण की तारीख़ रिकॉर्ड में नहीं है।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
    ask_en: "Hello, please send a copy of your GST registration certificate (REG-06)."
    ask_hi: "नमस्ते, कृपया अपने GST पंजीकरण प्रमाणपत्र (REG-06) की कॉपी भेजें।"

  # --- c7 people and news (optional) ---
  people_not_given:
    en: "Directors were not given, so people and news were not checked."
    hi: "निदेशकों के नाम नहीं दिए गए, इसलिए लोगों और ख़बरों की जाँच नहीं हुई।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  people_clear:
    en: "No adverse news was found about the directors."
    hi: "निदेशकों के बारे में कोई प्रतिकूल ख़बर नहीं मिली।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
  people_adverse:
    en: "A news report appears to concern one of the directors."
    hi: "एक ख़बर किसी निदेशक के बारे में लगती है।"
    contest_en: "Send any court or police document that settles the matter, or explain why the report is about someone else."
    contest_hi: "मामला सुलझाने वाला कोई अदालती या पुलिस दस्तावेज़ भेजें, या बताएँ कि ख़बर किसी और के बारे में क्यों है।"
  people_one_anchor:
    internal: true                 # a possible namesake; the approver checks by hand
    en: "A news item may be about a director (one matching detail); check by hand."
    hi: "एक ख़बर किसी निदेशक के बारे में हो सकती है (एक विवरण मेल खाता है); हाथ से जाँचें।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
    ask_en: "Hello, your onboarding needs a manual review step; no action is needed from you yet."
    ask_hi: "नमस्ते, आपकी ऑनबोर्डिंग में एक मैनुअल समीक्षा बाकी है; अभी आपको कुछ करने की ज़रूरत नहीं।"

  # --- not a finding about the carrier ---
  source_unavailable:
    en: "The source for this check did not answer: {gap}."
    hi: "इस जाँच का स्रोत जवाब नहीं दे सका: {gap}।"
    contest_en: "Nothing to send yet; we will retry the lookup."
    contest_hi: "अभी कुछ भेजने की ज़रूरत नहीं; हम जाँच दोबारा करेंगे।"
    ask_en: "Hello, we could not complete one of our checks because a government source did not respond. No action is needed from you yet; we will retry."
    ask_hi: "नमस्ते, एक सरकारी स्रोत के जवाब न देने से हमारी एक जाँच पूरी नहीं हो सकी। अभी आपको कुछ करने की ज़रूरत नहीं; हम दोबारा कोशिश करेंगे।"
  not_checked:
    internal: true                 # a knock-on of another gap; approver card only
    en: "This check was not run: {gap}."
    hi: "यह जाँच नहीं हुई: {gap}।"
    contest_en: "Send the corrected details named above."
    contest_hi: "ऊपर बताए गए सही विवरण भेजें।"
    ask_en: "Hello, one of our checks could not run because of the issue above. Please send the corrected details."
    ask_hi: "नमस्ते, ऊपर बताई गई समस्या के कारण हमारी एक जाँच नहीं हो सकी। कृपया सही विवरण भेजें।"
  not_built:
    internal: true                 # build status; approver card only
    en: "This check is not built yet: {gap}."
    hi: "यह जाँच अभी बनी नहीं है: {gap}।"
    contest_en: "Nothing to send."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं।"
    ask_en: "Hello, your onboarding is still being reviewed; no action is needed from you."
    ask_hi: "नमस्ते, आपकी ऑनबोर्डिंग की समीक्षा अभी चल रही है; आपको कुछ करने की ज़रूरत नहीं।"
  over_cost_cap:
    en: "This check was not run: the job reached its cost cap."
    hi: "यह जाँच नहीं हुई: काम अपनी लागत सीमा तक पहुँच गया।"
    contest_en: "Nothing to send; a reviewer will finish this check."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं; समीक्षक यह जाँच पूरी करेंगे।"
    ask_en: "Hello, your onboarding needs a manual review step; no action is needed from you yet."
    ask_hi: "नमस्ते, आपकी ऑनबोर्डिंग में एक मैनुअल समीक्षा बाकी है; अभी आपको कुछ करने की ज़रूरत नहीं।"
  over_time_limit:
    en: "This check was not run: the job reached its time limit."
    hi: "यह जाँच नहीं हुई: काम अपनी समय सीमा तक पहुँच गया।"
    contest_en: "Nothing to send; a reviewer will finish this check."
    contest_hi: "कुछ भेजने की ज़रूरत नहीं; समीक्षक यह जाँच पूरी करेंगे।"
    ask_en: "Hello, your onboarding needs a manual review step; no action is needed from you yet."
    ask_hi: "नमस्ते, आपकी ऑनबोर्डिंग में एक मैनुअल समीक्षा बाकी है; अभी आपको कुछ करने की ज़रूरत नहीं।"

