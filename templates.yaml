    ask_hi: "नमस्ते, आपके बैंक विवरण में भुगतान पाने वाले का नाम नहीं है। कृपया खाते पर लिखा नाम दिखाता रद्द चेक या बैंक का पत्र भेजें।"
    missing_en: "the payee name on your bank account"
    missing_hi: "आपके बैंक खाते पर भुगतान पाने वाले का नाम"
  payee_mismatch:
    en: "The payee name in the bank details does not match the legal or trade name GST holds."
    hi: "बैंक विवरण में भुगतान पाने वाले का नाम GST में दर्ज कानूनी या व्यापारिक नाम से मेल नहीं खाता।"
